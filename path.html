<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Math Adventure | Learn With Nini</title>
<meta name="description" content="Follow Nini's math path: play each game, earn XP, and unlock the next level.">
<meta name="theme-color" content="#FBF9FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2456;--muted:#7A718D;--purple:#468ADE;--pink:#F0785A;--gold:#F7B500;--line:#DFE9F5;--bg:#FBF9FF}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#FFF9E7,transparent),var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,sans-serif;min-height:100vh}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(251,249,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
@media (display-mode:standalone){.top{padding-top:max(34px,calc(10px + env(safe-area-inset-top,0px)))}}
.top a{text-decoration:none;font-weight:900;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.stats{display:flex;gap:6px}
.stats span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-weight:900;font-size:14px}
main{max-width:560px;margin:0 auto;padding:18px 16px 140px}
h1{font-family:"Fredoka",system-ui,sans-serif;font-size:clamp(34px,8vw,48px);line-height:1;margin:6px 0 6px;color:#3477C8;text-align:center}
.lead{text-align:center;color:var(--muted);font-weight:800;margin:0 0 14px}
.overall{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:6px}
.overall .bar{height:12px;background:#ECF3FB;border-radius:999px;overflow:hidden;margin-top:8px}
.overall .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:999px}
.overall b{font-family:"Fredoka",sans-serif;font-size:18px;color:#284C79}
.unit{position:relative;margin:30px 0 6px;border-radius:22px;overflow:hidden;color:#fff;min-height:170px;display:flex;align-items:flex-end;padding:16px;box-shadow:0 10px 24px rgba(40,76,120,.18);scroll-margin-top:80px}
.unit img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.unit:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(8,28,58,.78))}
.unit .ut{position:relative;z-index:1}
.unit.locked img{filter:grayscale(.85) brightness(.9)}
.unit .ulock{position:absolute;z-index:1;top:12px;right:12px;background:rgba(255,255,255,.92);color:#1F2456;font-weight:900;font-size:13px;padding:5px 10px;border-radius:999px}
.unit .uhere{position:absolute;z-index:1;top:12px;left:12px;background:#FFD23F;color:#1F2456;font-weight:900;font-size:13px;padding:5px 10px;border-radius:999px}
.passport{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.stamp{width:62px;height:62px;border-radius:50%;border:3px dashed #B9C9DD;display:grid;place-items:center;font-size:26px;filter:grayscale(1);opacity:.45;transform:rotate(-8deg);background:#fff}
.stamp.got{filter:none;opacity:1;border:3px solid #E5533A;color:#E5533A;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #E5533A}
.stamp small{display:block;font:900 8px/1 "Nunito",sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-top:-6px}
.stop.chk .node{border-radius:50%;border:4px dashed #9FB4CC;background:#fff;box-shadow:0 7px 0 #D5DFEA}
.stop.chk.done .node{border:4px solid #E5533A;background:#FFF4EF;box-shadow:0 7px 0 #E9B7A9}
.unit small{display:block;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.9;font-size:12px}
.unit h2{margin:2px 0 0;font-family:"Fredoka",sans-serif;font-size:26px;line-height:1.1}
.unit .trip{display:block;font-weight:800;font-size:14px;opacity:.95;margin-top:2px}
.u1{background:linear-gradient(135deg,#F0785A,#FF8A65)}.u2{background:linear-gradient(135deg,#468ADE,#2F9DF5)}
.u3{background:linear-gradient(135deg,#1E9E58,#2FBFA4)}.u4{background:linear-gradient(135deg,#E2A400,#F0785A)}
.track{position:relative;padding:8px 0}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;margin:22px 0;width:140px}
.stop.cur{margin-top:52px}
.node{position:relative;width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:36px;
  background:#E4EBF3;box-shadow:0 7px 0 #C7D2E0;transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 #C7D2E0}
.node svg{position:absolute;inset:-9px;pointer-events:none}
.stop.done .node{background:linear-gradient(145deg,#FFD84D,#F7B500);box-shadow:0 7px 0 #C98F00}
.stop.cur .node{background:linear-gradient(145deg,#3EBAF4,#468ADE);box-shadow:0 7px 0 #2F72C4;animation:pulse 1.8s ease-in-out infinite}
.stop.lock .node{filter:grayscale(1);opacity:.55}
.label{margin-top:12px;font-weight:900;font-size:14px;text-align:center;line-height:1.15}
.label span{display:block;color:var(--muted);font-size:12px;font-weight:800}
.start{position:absolute;top:-34px;background:#fff;color:#468ADE;border:2px solid #D8E7FA;font:700 15px/1 "Fredoka",sans-serif;padding:7px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.nini{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid #F5633E;background:#fff;top:12px}
.check{position:absolute;right:-4px;top:-4px;background:#1E9E58;color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:3px solid #fff}
.tip{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(92vw,440px);background:#1d3c63;color:#fff;border-radius:18px;padding:14px 16px;font-weight:800;font-size:15px;display:none;box-shadow:0 10px 30px rgba(29,60,99,.35)}
.tip.on{display:block}
.tip a.go{display:inline-block;margin-top:10px;background:linear-gradient(135deg,#44B8EE,#468ADE);color:#fff;text-decoration:none;font:700 17px/1 "Fredoka",sans-serif;padding:11px 16px;border-radius:12px}
.tip button{float:right;border:0;background:none;color:#fff;font-size:20px;cursor:pointer}
.trophy{text-align:center;margin-top:30px;font-weight:900;color:var(--muted)}
.trophy b{display:block;font-size:64px;line-height:1.1;filter:grayscale(1);opacity:.5}
.trophy.won b{filter:none;opacity:1}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.stop.cur .node,.start{animation:none}}
.u4 img{object-position:center 72%}
button.stamp{font:inherit;cursor:pointer;padding:0}
.stop.boss .node{width:96px;height:96px;font-size:42px;background:linear-gradient(145deg,#FF9B7A,#E5533A);box-shadow:0 7px 0 #B23B26}
.stop.boss.lock .node{background:#E4EBF3;box-shadow:0 7px 0 #C7D2E0}
.stop.boss.done .node{background:linear-gradient(145deg,#FFD84D,#F7B500);box-shadow:0 7px 0 #C98F00}
#postcard{position:fixed;inset:0;z-index:50;background:rgba(20,44,74,.55);display:grid;place-items:center;padding:16px}
#postcard .pc{width:min(440px,100%);background:#FFFDF6;border-radius:22px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.35);transform:rotate(-1.5deg);animation:pcIn .45s ease-out}
#postcard .pcimg{position:relative;height:230px}#postcard .pcimg img{width:100%;height:100%;object-fit:cover}
.u4-pc{object-position:center 70%}
#postcard .pcstamp{position:absolute;right:12px;top:12px;width:70px;height:70px;border-radius:50%;background:#fff;border:3px solid #E5533A;color:#E5533A;display:grid;place-items:center;font-size:28px;transform:rotate(10deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #E5533A}
#postcard .pcstamp small{display:block;font:900 8px/1 "Nunito",sans-serif;text-transform:uppercase;margin-top:-8px}
#postcard .pcbody{padding:16px 18px 18px;font-weight:800;color:#3c4566}
#postcard .pcnew{display:inline-block;background:#FFD23F;color:#1F2456;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900;margin-bottom:6px}
#postcard .pcto{font:700 22px/1.1 "Fredoka",sans-serif;color:#1E6FD9}
#postcard p{font-size:17px;line-height:1.45;margin:8px 0 10px;font-family:"Fredoka",sans-serif;font-weight:500;color:#2c3557}
#postcard .pcsign{display:flex;align-items:center;gap:8px;font:600 18px "Fredoka",sans-serif;color:#E5533A}#postcard .pcsign img{width:38px;height:38px;border-radius:50%}
#postcard .pcbtn{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,#45b8ed,#1E6FD9);color:#fff;font:700 18px/1 "Fredoka",sans-serif;cursor:pointer}
@keyframes pcIn{from{transform:rotate(-8deg) scale(.85);opacity:0}to{transform:rotate(-1.5deg);opacity:1}}
</style>
<!-- Learn With Nini app (Add to Home Screen) -->
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nini Math">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png?v=3">
<script src="/fun.js"></script>
<script src="/install-banner.js" defer></script>
</head>
<body>
<header class="top">
  <a href="/">🏠 Home</a>
  <div class="stats"><span id="xpStat">⚡ 0 XP</span><span id="lvlStat">🗺️ 0/21</span></div>
</header>
<main>
  <h1>My Math Adventure</h1>
  <p class="lead">Travel with Nini! Finish levels to collect passport stamps.</p>
  <div class="passport" id="passport" aria-label="Passport stamps"></div>
  <div class="overall"><b id="overallText">Let's start!</b><div class="bar"><i id="overallBar" style="width:0%"></i></div></div>
  <div id="path"></div>
  <div class="trophy" id="trophy"><b>🏆</b>Finish the whole adventure to win the Nini Math Trophy!</div>
</main>
<div class="tip" id="tip" role="dialog" aria-live="polite"></div>

<script>
(function(){
  // Each level is an existing game. A level is complete at GOAL XP earned in that game.
  var GOAL = 30;
  var UNITS = [
    {cls:"u1", n:1, place:"Hawaii", emoji:"🏄‍♀️", photo:"/adv-hawaii.webp", trip:"Surf with Nini", title:"Number Sense", steps:[
      {id:"place_value", icon:"🔢", name:"Place Value Challenge", url:"place-value-challenge.html"},
      {id:"number_battle", icon:"⚔️", name:"Number Battle", url:"number-battle.html"},
      {id:"money", icon:"🪙", name:"Money Match", url:"money-match.html"},
      {boss:1},
      {chk:1}]},
    {cls:"u2", n:2, place:"Alaska", emoji:"⛷️", photo:"/adv-alaska.webp", trip:"Ski with Nini", title:"Time, Times & Sharing", steps:[
      {id:"time", icon:"⏰", name:"Time Match", url:"time-match.html"},
      {id:"multiplication", icon:"✖️", name:"Multiplication Sprint", url:"multiplication-sprint.html"},
      {id:"division", icon:"➗", name:"Division Dash", url:"division-dash.html"},
      {boss:2},
      {chk:2}]},
    {cls:"u3", n:3, place:"China", emoji:"🏯", photo:"/adv-china.webp", trip:"Walk the Great Wall", title:"Puzzles & Fractions", steps:[
      {id:"math_maze", icon:"🧩", name:"Math Maze", url:"math-maze.html"},
      {id:"fraction", icon:"🍕", name:"Fraction Builder", url:"fraction-builder.html"},
      {id:"detective", icon:"🔎", name:"Math Detective", url:"math-detective.html"},
      {boss:3},
      {chk:3}]},
    {cls:"u4", n:4, place:"Italy", emoji:"🍕", photo:"/adv-italy.webp", trip:"Visit the Leaning Tower", title:"Shapes & Measuring", steps:[
      {id:"geometry", icon:"📐", name:"Geometry Builder", url:"geometry-builder.html"},
      {id:"length", icon:"📏", name:"Length Lab", url:"length-lab.html"},
      {id:"capacity", icon:"🥤", name:"Capacity Lab", url:"capacity-lab.html"},
      {id:"weight_mass", icon:"⚖️", name:"Weight & Mass Lab", url:"weight-mass-lab.html"},
      {boss:4},
      {chk:4}]}
  ];
  var OFFSETS = [0, 70, 100, 70, 0, -70, -100, -70];
  var BOSS = {1:{icon:"🌊",name:"The Big Wave"},2:{icon:"🏔️",name:"The Snow Mountain"},3:{icon:"🐉",name:"The Great Wall Dragon"},4:{icon:"🗼",name:"The Leaning Tower"}};
  var POSTCARDS = {
    1:"Aloha from Hawaii! 🌺 I learned to surf right here. You finished Number Sense, that's like catching your very first wave! Next stop: Alaska ⛷️",
    2:"Brrr, greetings from the snow in Alaska! ❄️ Skiing takes practice, just like times tables, and you did it! Next stop: China 🏯",
    3:"Nǐ hǎo from the Great Wall of China! It is SO long, like a giant number line. You crushed Puzzles & Fractions! Next stop: Italy 🍕",
    4:"Ciao from the Leaning Tower of Pisa! 🇮🇹 It leans almost 4 degrees, that's geometry! You finished the whole adventure. I'm so proud of you! 🏆"
  };
  function getJ(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  // Daily Challenges finished: XP counter, or the days saved in the challenge history (whichever is more)
  function dailyCount(s){var days={};(getJ("dm-log",[])||[]).forEach(function(r){if(r&&r.date)days[r.date]=1});return Math.max(s.dailyDone||0,Object.keys(days).length)}

  function state(){
    try{ if(window.LWNXP && LWNXP.state) return LWNXP.state(); }catch(e){}
    try{ var s=JSON.parse(localStorage.getItem("lwn-xp-v1")||"{}"); s.games=s.games||{}; s.days=s.days||{}; s.dailyDone=s.dailyDone||0; return s; }catch(e){ return {games:{},days:{},dailyDone:0}; }
  }
  function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ring(frac, color){
    var r=50,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));
    return '<svg viewBox="0 0 104 104" width="104" height="104" aria-hidden="true"><circle cx="52" cy="52" r="'+r+'" fill="none" stroke="#E8F0FA" stroke-width="7"/>'+
      '<circle cx="52" cy="52" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 52 52)"/></svg>';
  }

  function render(){
    var s=state(), games=s.games||{}, daily=dailyCount(s), bosses=getJ("lwn-boss-v1",{})||{};
    var steps=[], foundCurrent=false, doneCount=0, total=0;
    UNITS.forEach(function(u){ var unitOk=true; u.steps.forEach(function(st){
      total++;
      var progress, done, label, sub;
      if(st.boss){
        done=!!bosses["u"+st.boss]; progress=done?1:0;
        st.icon=BOSS[st.boss].icon; st.name="Boss: "+BOSS[st.boss].name; st.url="boss.html?u="+st.boss;
        sub=done?"Boss beaten! 🏆":"Get 8 of 10 right in 3 min";
      }else if(st.chk){
        // the stamp is the end of the unit: every game and the boss must be done first
        progress=Math.min(1,daily/st.chk); done=daily>=st.chk && unitOk;
        st.icon=u.emoji; st.name=u.place+" Stamp"; st.url="daily-challenge.html";
        sub=done?"Stamp collected!":(daily>=st.chk?"Finish this unit's levels and boss first":"Finish "+st.chk+" Daily Challenge"+(st.chk>1?"s":"")+" ("+Math.min(daily,st.chk)+"/"+st.chk+")");
      }else{
        var xp=games[st.id]||0; progress=Math.min(1,xp/GOAL); done=xp>=GOAL;
        sub=done?"Complete!":Math.min(xp,GOAL)+" / "+GOAL+" XP";
      }
      var status = done ? "done" : (!foundCurrent ? (foundCurrent=true,"cur") : "lock");
      if(done) doneCount++; else unitOk=false;
      steps.push({u:u, st:st, status:status, progress:progress, sub:sub});
    }); });

    document.getElementById("xpStat").textContent="⚡ "+Object.keys(games).reduce(function(a,k){return a+(games[k]||0)},0)+" XP";
    document.getElementById("lvlStat").textContent="🗺️ "+doneCount+"/"+total;
    document.getElementById("overallBar").style.width=Math.round(doneCount/total*100)+"%";
    var curStep=steps.filter(function(x){return x.status==="cur"})[0];
    document.getElementById("overallText").textContent = doneCount===total ? "You finished the whole adventure! 🏆" :
      (doneCount===0 ? "First stop: Hawaii 🏄‍♀️" : "📍 "+curStep.u.place+" "+curStep.u.emoji+" · "+doneCount+" of "+total+" levels done");
    document.getElementById("passport").innerHTML=UNITS.map(function(u){
      var got=steps.some(function(x){return x.u===u&&x.st.chk&&x.status==="done"});
      return '<button type="button" class="stamp'+(got?' got':'')+'" data-u="'+u.n+'" title="'+esc(u.place)+(got?' stamp collected — tap for Nini\'s postcard':' stamp')+'"><span>'+u.emoji+'<small>'+esc(u.place)+'</small></span></button>';
    }).join("");
    document.querySelectorAll("#passport .stamp").forEach(function(b){ b.onclick=function(){ if(b.classList.contains("got")) postcard(+b.dataset.u); else { var t=document.getElementById("tip"); t.innerHTML='<button type="button" aria-label="Close">×</button>🛂 Collect the <b>'+esc(UNITS[b.dataset.u-1].place)+'</b> stamp to get a postcard from Nini!'; t.classList.add("on"); t.querySelector("button").onclick=function(){t.classList.remove("on")}; } }; });
    // a brand-new stamp → Nini's postcard pops up once
    var seen=getJ("lwn-postcards-v1",[])||[];
    seen=seen.map(String);
    var fresh=UNITS.filter(function(u){return seen.indexOf(String(u.n))<0 && steps.some(function(x){return x.u===u&&x.st.chk&&x.status==="done"})})[0];
    if(fresh && !document.getElementById("postcard") && !render.pcPending){ render.pcPending=true; seen.push(String(fresh.n)); try{localStorage.setItem("lwn-postcards-v1",JSON.stringify(seen))}catch(e){} setTimeout(function(){render.pcPending=false;postcard(fresh.n,true)},700); }
    document.getElementById("trophy").classList.toggle("won", doneCount===total);

    var html="", i=0, lastUnit=null;
    steps.forEach(function(x){
      if(x.u!==lastUnit){ if(lastUnit) html+="</div>";
        var us=steps.filter(function(y){return y.u===x.u}), locked=us.every(function(y){return y.status==="lock"}), here=us.some(function(y){return y.status==="cur"});
        html+='<div class="unit '+x.u.cls+(locked?' locked':'')+'" id="'+x.u.cls+'"><img src="'+x.u.photo+'" alt="Nini in '+esc(x.u.place)+'">'+
          (locked?'<span class="ulock">🔒 Coming up</span>':'')+(here?'<span class="uhere">📍 Nini is here!</span>':'')+
          '<div class="ut"><small>Unit '+x.u.n+' · '+esc(x.u.place)+' '+x.u.emoji+'</small><h2>'+esc(x.u.title)+'</h2><span class="trip">'+esc(x.u.trip)+'</span></div></div><div class="track">'; lastUnit=x.u; i=0; }
      var off=OFFSETS[i%OFFSETS.length]; i++;
      var color = x.status==="done" ? "#F7B500" : "#F0785A";
      html+='<div class="stop '+x.status+(x.st.chk?" chk":"")+(x.st.boss?" boss":"")+'" style="margin-left:calc(50% - 70px + '+off+'px)">'+
        (x.status==="cur" ? '<div class="start">'+(x.st.chk?'Get your stamp!':x.st.boss?'Boss battle! ⚔️':(steps.indexOf(x)===0?'START':'Next stop!'))+'</div>' : '')+
        '<button class="node" type="button" data-i="'+steps.indexOf(x)+'" aria-label="'+esc(x.st.name)+': '+esc(x.sub)+'">'+
        (x.status!=="lock" ? ring(x.progress,color) : "")+'<span>'+(x.status==="lock"?"🔒":x.st.icon)+'</span>'+
        (x.status==="done" ? '<span class="check">✓</span>' : '')+'</button>'+
        (x.status==="cur" ? '<img class="nini" src="/nini-face.webp" alt="" style="'+(off>0?"left:-58px":"right:-58px")+'">' : '')+
        '<div class="label">'+esc(x.st.name)+'<span>'+esc(x.sub)+'</span></div></div>';
    });
    if(lastUnit) html+="</div>";
    var el=document.getElementById("path"); el.innerHTML=html;
    el.querySelectorAll(".node").forEach(function(b){ b.addEventListener("click",function(){ openTip(steps[+b.dataset.i]); }); });
    var cur=el.querySelector(".stop.cur");
    var target=/^#u[1-4]$/.test(location.hash)?document.querySelector(location.hash):cur;
    if(target && !render.scrolled){ render.scrolled=true; setTimeout(function(){ target.scrollIntoView({block:target===cur?"center":"start",behavior:"smooth"}); },300); }
  }

  function openTip(x){
    var t=document.getElementById("tip"), st=x.st;
    var msg = x.status==="lock"
      ? "🔒 <b>"+esc(st.name)+"</b> unlocks after you finish the glowing level. (You can still play any game from the home page.)"
      : x.status==="done"
        ? (st.boss ? "🏆 You beat <b>"+esc(BOSS[st.boss].name)+"</b>! Battle again anytime for more XP." : st.chk ? "🛂 <b>"+esc(st.name)+"</b> collected!"+(UNITS[x.u.n]?" Nini says: Next stop, "+esc(UNITS[x.u.n].place)+" "+UNITS[x.u.n].emoji+"!":" You finished the whole trip!") : "✅ <b>"+esc(st.name)+"</b> is complete! Play again anytime for more XP.")
        : st.boss ? "⚔️ <b>"+esc(st.name)+"</b><br>A boss blocks the way to the "+esc(x.u.place)+" stamp! Get 8 of 10 mixed questions right in 3 minutes to beat it."
        : st.chk ? x.u.emoji+" <b>"+esc(st.name)+"</b><br>"+esc(x.sub)+" to get your passport stamp!"+(UNITS[x.u.n]?"<br>Next stop: "+esc(UNITS[x.u.n].place)+" "+UNITS[x.u.n].emoji:"")
                 : "<b>"+esc(st.icon+" "+st.name)+"</b><br>Earn "+GOAL+" XP in this game to finish the level. ("+esc(x.sub)+")";
    t.innerHTML='<button type="button" aria-label="Close">×</button>'+msg+(x.status!=="lock" ? '<br><a class="go" href="'+st.url+'">'+(x.status==="done"?"Play again →":"Let's go! →")+'</a>' : "");
    t.classList.add("on");
    t.querySelector("button").onclick=function(){ t.classList.remove("on"); };
    var go=t.querySelector("a.go");
    if(go&&!st.chk&&!st.boss) go.addEventListener("click",function(){ try{sessionStorage.setItem("lwn-trip",JSON.stringify({u:x.u.n,page:st.url.split("?")[0]}))}catch(e){} });
  }

  function postcard(n,isNew){
    var u=UNITS[n-1], old=document.getElementById("postcard"); if(old) old.remove();
    var m=document.createElement("div"); m.id="postcard";
    m.innerHTML='<div class="pc" role="dialog" aria-modal="true" aria-label="Postcard from Nini"><div class="pcimg"><img src="'+u.photo+'"'+(n===4?' style="object-position:center 70%"':'')+' alt="Nini in '+esc(u.place)+'"><span class="pcstamp">'+u.emoji+'<small>'+esc(u.place)+'</small></span></div>'+
      '<div class="pcbody">'+(isNew?'<div class="pcnew">🛂 New stamp collected!</div>':'')+'<div class="pcto">Postcard from Nini</div><p>'+esc(POSTCARDS[n])+'</p><div class="pcsign"><img src="/nini-face.webp" alt=""> Love, Nini</div>'+
      '<button type="button" class="pcbtn">'+(isNew&&UNITS[n]?"Next stop: "+esc(UNITS[n].place)+" "+UNITS[n].emoji+" →":"Close")+'</button></div></div>';
    m.addEventListener("click",function(e){ if(e.target===m||e.target.classList.contains("pcbtn")){ m.remove(); render(); } });
    document.body.appendChild(m);
    if(isNew){ try{ LWNFun.confetti(180); LWNFun.play("win"); }catch(e){} }
  }

  render();
  // xp.js loads a moment later; re-render once it is ready, and when returning to this page.
  var n=0, iv=setInterval(function(){ if(window.LWNXP||++n>20){ clearInterval(iv); render(); } },250);
  window.addEventListener("pageshow", render);
})();
</script>
</body>
</html>
