<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Weekly Reports | Learn With Nini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px 16px;font-family:"Nunito",Arial,sans-serif;color:#203D61;background:linear-gradient(180deg,#E6F2FC,#fff)}
    .card{width:min(460px,100%);background:#fff;border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 18px 50px rgba(55,98,150,.14)}
    .big{font-size:56px;line-height:1}
    h1{font-family:"Fredoka",sans-serif;color:#3377cb;font-size:1.8rem;margin:12px 0 8px}
    p{color:#596181;font-weight:700;line-height:1.55}
    a.btn{display:inline-block;margin-top:14px;background:linear-gradient(135deg,#45b8ed,#478add);color:#fff;text-decoration:none;font-family:"Fredoka",sans-serif;font-size:1.15rem;padding:13px 26px;border-radius:999px}
    a.small{display:block;margin-top:14px;color:#3577c8;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <div class="big" id="ic">⏳</div>
    <h1 id="h">One moment…</h1>
    <p id="p">Updating your weekly report setting.</p>
    <a class="btn" href="/">Back to the games</a>
    <a class="small" href="/account.html">Account settings</a>
  </div>
<script>
(function(){
  var q=new URLSearchParams(location.search), u=q.get("u"), s=q.get("s");
  function show(ic,h,p){document.getElementById("ic").textContent=ic;document.getElementById("h").textContent=h;document.getElementById("p").textContent=p;}
  if(!u||!s){show("🤔","Link not complete","Please use the “Stop weekly reports” link from the email, or turn reports off on your account page.");return;}
  fetch("https://wvcdihtphcjuegdkadsb.supabase.co/functions/v1/weekly-report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({u:u,s:s})})
    .then(function(r){return r.json()})
    .then(function(d){ if(d&&d.ok) show("✅","Weekly reports are off","You won’t get weekly progress emails anymore. You can turn them back on anytime on your account page.");
      else show("🤔","That link didn’t work","Please turn weekly reports off on your account page instead."); })
    .catch(function(){show("📶","Couldn’t reach us","Check your internet and open the link again, or turn reports off on your account page.");});
})();
</script>
</body>
</html>
