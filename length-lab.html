<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Length Lab | Learn With Nini</title>
<style>
body{font-family:Nunito,Arial,sans-serif;background:#fff8fc;color:#272052;text-align:center;padding:20px}.card{background:white;border-radius:30px;padding:28px;max-width:760px;margin:auto;box-shadow:0 10px 35px #ddd}h1{color:#6f35df;font-size:42px}.fact{background:#fff3c9;border-radius:18px;padding:18px;margin:15px;display:none}.score{font-size:22px;font-weight:bold}.btn{padding:14px 22px;border:0;border-radius:24px;background:#6f35df;color:white;font-weight:bold;margin:8px;cursor:pointer;font-size:16px}.choice{background:#f0edff;color:#272052}.choice:hover{background:#e5dcff}.small{color:#666}
</style>
</head>
<body>
<div class="card">
<h1>📏 Length Lab</h1>
<p>Learn inches, feet, yards, and real-world measuring!</p>
<button class="btn" onclick="review()">📏 Review Measurement Facts</button>
<div id="review" class="fact">📏 12 inches = 1 foot<br>📏 3 feet = 1 yard<br>📏 36 inches = 1 yard</div>
<h2 id="level">Level 1: Measurement Explorer</h2>
<div class="score">⭐ Points: <span id="score">0</span></div>
<div class="small">Round <span id="round">1</span> · Question <span id="num">1</span>/10</div>
<h3 id="question"></h3>
<div id="choices"></div>
<p id="message"></p>
</div>
<script>
let level=1,round=1,question=1,score=0,last="";
const levelNames={1:'Measurement Explorer',2:'Feet & Inches Builder',3:'Real World Measurement',4:'Measurement Challenge'};
const bank=[
[{q:'How many inches are in 1 foot?',a:['10','12','20'],c:1},{q:'A pencil is best measured in?',a:['inches','feet','yards'],c:0},{q:'Which is longer?',a:['2 feet','18 inches'],c:0}],
[{q:'3 feet equals how many inches?',a:['24','36','48'],c:1},{q:'48 inches equals how many feet?',a:['3','4','5'],c:1},{q:'A rope is 3 feet 6 inches. How many inches?',a:['36','42','48'],c:1}],
[{q:'A surfboard is 6 feet long. How many inches?',a:['60','72','84'],c:1},{q:'A classroom is best measured in?',a:['inches','feet','yards'],c:1},{q:'A book is about?',a:['10 inches','10 feet','10 yards'],c:0}],
[{q:'An 8 foot rope is how many inches?',a:['86','96','108'],c:1},{q:'4 ft 8 in + 3 ft 9 in = ?',a:['7 ft 17 in','8 ft 5 in','9 ft'],c:1},{q:'60 inches equals how many feet?',a:['4','5','6'],c:1}]
];
function review(){document.getElementById('review').style.display='block'}
function next(){let list=bank[level-1],item;do{item=list[Math.floor(Math.random()*list.length)]}while(item.q===last);last=item.q;questionEl=item;document.getElementById('question').innerHTML=item.q;document.getElementById('choices').innerHTML='';item.a.forEach((x,i)=>{let b=document.createElement('button');b.className='btn choice';b.innerHTML=x;b.onclick=()=>answer(i===item.c);document.getElementById('choices').appendChild(b)});document.getElementById('round').innerHTML=round;document.getElementById('num').innerHTML=question}
function answer(ok){if(ok){score+=10;document.getElementById('message').innerHTML='✅ Correct!'}else{document.getElementById('message').innerHTML='Remember: 12 inches = 1 foot'}document.getElementById('score').innerHTML=score;question++;if(question>10){question=1;round++;if(round%2===1&&level<4)level++;document.getElementById('level').innerHTML='Level '+level+': '+levelNames[level];document.getElementById('message').innerHTML='🎉 New round! Keep going — it gets harder!'}setTimeout(next,700)}
next();
</script>
</body>
</html>
