name: Build social preview

on:
  push:
    branches: [main]
    paths:
      - social-preview-source.svg
      - .github/workflows/build-social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render 1200x630 social preview
        run: |
          rsvg-convert -w 1200 -h 630 social-preview-source.svg -o social-preview.png

      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          if git diff --cached --quiet; then
            echo "Preview is already up to date."
            exit 0
          fi
          git commit -m "Generate social link preview"
          git pull --rebase origin main
          git push origin HEAD:main
