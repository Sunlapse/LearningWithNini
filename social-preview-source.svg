<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffafd"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b3cec"/>
      <stop offset="100%" stop-color="#2f9df5"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="765" y="0" width="435" height="630" rx="0"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#55389a" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="85" cy="70" r="125" fill="#dff5ff"/>
  <circle cx="1110" cy="90" r="130" fill="#fff0f8"/>
  <path d="M0 475 C160 400 240 515 390 455 C520 402 650 425 760 520 L760 630 L0 630Z" fill="#eef8ff"/>
  <path d="M660 630 C735 495 848 485 947 540 C1037 591 1103 545 1200 490 L1200 630Z" fill="#dff8ef"/>

  <g opacity=".65" stroke="#b8def8" stroke-width="2">
    <path d="M18 210H150M18 242H150M18 274H150M50 178V306M82 178V306M114 178V306"/>
    <path d="M1080 34H1194M1080 66H1194M1080 98H1194M1112 8V128M1144 8V128M1176 8V128"/>
  </g>

  <g clip-path="url(#photoClip)">
    <image x="735" y="-55" width="520" height="760" preserveAspectRatio="xMidYMid slice" href="nini-hero.webp" xlink:href="nini-hero.webp"/>
    <rect x="735" y="0" width="115" height="630" fill="url(#fade)"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="84" y="182" font-size="78" font-weight="800" fill="#6732d3" letter-spacing="-3">Learn With</text>
    <text x="84" y="260" font-size="88" font-weight="800" fill="#ef4d9a" letter-spacing="-4">Nini</text>
    <path d="M88 281 C200 303 350 300 492 278" fill="none" stroke="#69c6f3" stroke-width="9" stroke-linecap="round"/>

    <rect x="82" y="319" width="420" height="70" rx="35" fill="#e6fbf7"/>
    <text x="112" y="365" font-size="37" font-weight="800" fill="#1f2456">Math Made Fun</text>

    <rect x="82" y="418" width="555" height="78" rx="39" fill="url(#pill)" filter="url(#shadow)"/>
    <text x="122" y="467" font-size="31" font-weight="700" fill="#ffffff">Daily 20-Minute Math Challenge</text>

    <text x="84" y="554" font-size="29" font-weight="700" fill="#1f2456">learnwithnini.com</text>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="800">
    <text x="535" y="116" font-size="58" fill="#62c8f2" transform="rotate(-8 535 116)">+</text>
    <text x="652" y="160" font-size="52" fill="#14b8a6" transform="rotate(7 652 160)">3</text>
    <text x="690" y="335" font-size="44" fill="#f7b817" transform="rotate(-7 690 335)">7 × 8 = 56</text>
    <text x="638" y="590" font-size="60" fill="#ef4d9a">♡</text>
  </g>

  <g transform="translate(30 42)">
    <path d="M50 4 L62 33 L94 36 L69 56 L77 88 L50 70 L23 88 L31 56 L6 36 L38 33Z" fill="#ffd45c" stroke="#1f2456" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1080 365)">
    <circle cx="38" cy="38" r="28" fill="#ffd45c" stroke="#1f2456" stroke-width="5"/>
    <path d="M28 60H48M30 69H46" stroke="#1f2456" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 8V-4M9 20L0 12M67 20L76 12" stroke="#1f2456" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>